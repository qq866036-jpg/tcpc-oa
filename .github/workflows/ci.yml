name: ci

# tcpc-oa 插件仓 CI（TASK-2320 P3）
#
# 判据**唯一出处**是 `scripts/ci-check.sh`，本文件只负责触发与环境 —— 禁止在 yml 里另写一套 shell
# （PIT-036：CI 里的 shell 与本地验过的 shell 两份实现必然漂移）。
#
# 六项判据：语法 / 版本三方 / 反向依赖守卫 / 骨架完整性 / 构建产物 / 契约自洽。

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  ci-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: none
          coverage: none

      - name: ci-check（唯一判据）
        run: bash scripts/ci-check.sh
